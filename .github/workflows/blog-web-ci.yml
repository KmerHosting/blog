name: Blog web CI

on:
  push:
  pull_request:

jobs:
  public-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Carbon public-surface audit
        run: npm run audit:carbon
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Production build with isolated content API
        run: npm run build:ci
