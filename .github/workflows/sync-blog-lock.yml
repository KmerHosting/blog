name: Sync public blog package lock

on:
  push:
    branches: [feat/carbon-public-rebuild]
    paths: [.github/workflows/sync-blog-lock.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carbon-public-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync public blog package lock"
          git push origin HEAD:feat/carbon-public-rebuild
